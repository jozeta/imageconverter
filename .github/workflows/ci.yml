name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the release script counts commits for CFBundleVersion
      - run: swift --version
      - name: Lint
        run: if command -v swiftlint >/dev/null; then swiftlint --strict; else echo "SwiftLint not on this runner; skipped."; fi
      - name: Build and test
        run: swift test
      - name: Lint scripts
        run: |
          if command -v shellcheck >/dev/null; then shellcheck scripts/*.sh
          else for f in scripts/*.sh; do bash -n "$f"; done; fi
      - name: Build the app bundle (ad hoc signed) and verify it
        # SKIP_APPINTENTS=1: the Shortcuts metadata step (Metadata.appintents) runs Xcode's appintentsmetadataprocessor
        # with the arguments and build layout of the Xcode used for releases; the runner's older Xcode differs. Real
        # releases are built locally with the current Xcode; release.sh refuses the skip with a real identity or
        # --notarize.
        env:
          SKIP_APPINTENTS: "1"
        run: |
          scripts/release.sh
          codesign --verify --strict --deep --verbose=2 dist/imageconverter.app
          dist/imageconverter.app/Contents/Helpers/imageconverter --version
